name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yaml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - name: Extract version
        run: echo "VERSION=$(grep -oP 'BLUR_VERSION = "\K[^"]+' src/common/blur.h)" >> $GITHUB_ENV

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured, falling back to debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build release APK (unit tests + assemble)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          SIGNING_ARGS=()
          if [ -n "$KEYSTORE_BASE64" ] && [ -f release.keystore ]; then
            SIGNING_ARGS=(-PSTORE_FILE=release.keystore -PSTORE_PASSWORD="$STORE_PASSWORD" -PKEY_ALIAS="$KEY_ALIAS" -PKEY_PASSWORD="$KEY_PASSWORD")
          fi
          ./gradlew testReleaseUnitTest assembleRelease \
            -PappVersionName="${VERSION}-android" "${SIGNING_ARGS[@]}"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "blur-Android-${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: blur-Android-${{ env.VERSION }}
          path: blur-Android-${{ env.VERSION }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: blur-Android-${{ env.VERSION }}.apk
